# Pixel golden floors + Hub pin lockstep. No model weights, no Metal generate.
name: Eval floors

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: eval-floors-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floors:
    name: Golden metric floors
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mlx-swift 0.31.6 is tools-version 6.3. macos-15 defaults to Xcode 16.x
      # (Swift < 6.3), which cannot resolve that pin.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: eval-floors-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            eval-floors-${{ runner.os }}-

      - name: Hub pins + eval floors
        run: ./Scripts/ci-eval-floors.sh
