name: ImarelloIOS
options:
  bundleIdPrefix: app.imarello
  deploymentTarget:
    iOS: "26.2"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.2"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FK2D8X36G2
packages:
  Imarello:
    path: ../..
targets:
  ImarelloIOS:
    type: application
    platform: iOS
    deploymentTarget: "26.2"
    sources:
      - path: ImarelloIOS
      - path: ../../outputs/demo/woman_t2i.png
        buildPhase: resources
      - path: ../../outputs/demo/woman_i2i.png
        buildPhase: resources
    attributes:
      SystemCapabilities:
        com.apple.IncreasedMemoryLimit:
          enabled: 1
        com.apple.ExtendedVirtualAddressing:
          enabled: 1
    entitlements:
      path: ImarelloIOS/ImarelloIOS.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.imarello.demo
        PRODUCT_NAME: Imarello
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Imarello
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Imarello saves generated images to your photo library when you tap Save.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: ImarelloIOS/ImarelloIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Imarello
        product: ImarelloRuntime
      - package: Imarello
        product: ImarelloDirect
    postBuildScripts:
      - name: Embed Full no-JIT MLX Metallib
        script: |
          "${SRCROOT}/../../Scripts/embed-ios-metallib.sh"
        inputFiles:
          - "${SRCROOT}/ImarelloSpikes/mlx-full.metallib"
          - "${SRCROOT}/ImarelloSpikes/imarello-direct.metallib"
          - "${SRCROOT}/ImarelloSpikes/imarello-direct-manifest.json"
        outputFiles:
          - "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/mlx.metallib"
          - "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/imarello-direct.metallib"
          - "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/imarello-direct-manifest.json"
  ImarelloIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.2"
    sources:
      - path: ImarelloIOSTests
    hostApplication: ImarelloIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.imarello.demo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Imarello.app/Imarello"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: ImarelloIOS
  ImarelloIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.2"
    sources:
      - path: ImarelloIOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.imarello.demo.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ImarelloIOS
  ImarelloSpikes:
    type: application
    platform: iOS
    deploymentTarget: "26.2"
    sources:
      - path: ImarelloSpikes
        excludes:
          - "mlx-full.metallib"
          - "imarello-direct.metallib"
          - "imarello-direct-manifest.json"
      # Full nojit MLX metallib compiled for iphoneos (Scripts note: the
      # Cmlx-bundle metallib Xcode builds is the thin JIT-era set — gitignored,
      # rebuild via the ensure-metallib recipe with -sdk iphoneos).
      - path: ImarelloSpikes/mlx-full.metallib
        buildPhase: resources
      - path: ImarelloSpikes/imarello-direct.metallib
        buildPhase: resources
      - path: ImarelloSpikes/imarello-direct-manifest.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.imarello.spikes
        PRODUCT_NAME: ImarelloSpikes
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ImarelloSpikes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    dependencies:
      - package: Imarello
        product: ImarelloDirect
schemes:
  ImarelloIOS:
    build:
      targets:
        ImarelloIOS: all
        ImarelloIOSTests: [test]
        ImarelloIOSUITests: [test]
    test:
      targets:
        - ImarelloIOSTests
        - ImarelloIOSUITests
    run:
      config: Debug
    profile:
      config: Release
  ImarelloSpikes:
    build:
      targets:
        ImarelloSpikes: all
    run:
      config: Release
